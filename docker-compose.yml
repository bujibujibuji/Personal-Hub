services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: personal_hub
      MYSQL_USER: personal_hub
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci --innodb-buffer-pool-size=128M --performance-schema=OFF
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - private
    mem_limit: 512m

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PERSONAL_HUB_DB_URL: jdbc:mysql://db:3306/personal_hub?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      PERSONAL_HUB_DB_USERNAME: personal_hub
      PERSONAL_HUB_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      PERSONAL_HUB_ADMIN_USERNAME: ${PERSONAL_HUB_ADMIN_USERNAME:-admin}
      PERSONAL_HUB_ADMIN_PASSWORD: ${PERSONAL_HUB_ADMIN_PASSWORD:?Set PERSONAL_HUB_ADMIN_PASSWORD in .env}
      PERSONAL_HUB_UPLOAD_DIR: /app/uploads/images
      PERSONAL_HUB_FILE_DIR: /app/uploads/files
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 640m
    networks:
      - private

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8081:80"
    mem_limit: 160m
    networks:
      - private

volumes:
  mysql_data:
  uploads_data:

networks:
  private:
    driver: bridge
