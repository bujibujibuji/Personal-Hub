services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: personal_hub
      MYSQL_USER: personal_hub
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci --innodb-buffer-pool-size=128M --performance-schema=OFF
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - private
    mem_limit: 512m

  backend:
    # 默认使用 GitHub Actions 推送到 GHCR 的镜像；服务器上无法访问 GHCR 时，
    # 仍可 `docker compose build backend` 本地构建（build 配置保留为备用通道）。
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER in .env}/personal-hub-backend:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PERSONAL_HUB_DB_URL: jdbc:mysql://db:3306/personal_hub?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      PERSONAL_HUB_DB_USERNAME: personal_hub
      PERSONAL_HUB_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      PERSONAL_HUB_ADMIN_USERNAME: ${PERSONAL_HUB_ADMIN_USERNAME:-admin}
      PERSONAL_HUB_ADMIN_PASSWORD: ${PERSONAL_HUB_ADMIN_PASSWORD:?Set PERSONAL_HUB_ADMIN_PASSWORD in .env}
      PERSONAL_HUB_UPLOAD_DIR: /app/uploads/images
      PERSONAL_HUB_FILE_DIR: /app/uploads/files
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 640m
    networks:
      - private
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  web:
    # Caddy 直接面向公网提供 HTTPS（证书自动申请续期），/api 反代到后端。
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER in .env}/personal-hub-web:${TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # IP 直连模式：App/浏览器访问 http://服务器IP:8081（端口可用 .env 的 WEB_PORT 修改）。
      # 改用域名 + HTTPS 时，按 docs/deployment-public.md 改回 80/443 并设置 SITE_ADDRESS。
      - "${WEB_PORT:-8081}:80"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 160m
    networks:
      - private
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # 每 2 分钟检查一次 GHCR 是否有新镜像，有则自动拉取并重建标记的服务。
  # 原版 containrrr/watchtower 已停止维护且不兼容新版 Docker API，改用社区维护的分支。
  # 挂载 Docker 登录凭证（docker login ghcr.io 的产物）用于拉取私有镜像包。
  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    restart: unless-stopped
    command: --label-enable --interval 120 --cleanup
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # 用 sudo docker login 登录时凭证在 /root/.docker/config.json；
      # 若用普通用户登录则改为 ~/.docker/config.json。
      - /root/.docker/config.json:/config.json:ro
    mem_limit: 96m

volumes:
  mysql_data:
  uploads_data:
  caddy_data:
  caddy_config:

networks:
  private:
    driver: bridge
