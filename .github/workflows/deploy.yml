# 推送到 main 后自动构建并发布：
# - web 镜像（H5 前端）
# - backend 镜像（内含 App 热更新包：CI 自动打 wgt 并写入 resources/app/）
# 服务器上的 watchtower 会定期拉取新镜像并重启容器，实现"推代码即更新"。
name: build-and-publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-and-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: 构建并推送 personal-hub-web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR 镜像路径必须全小写。
      - name: 计算镜像名称
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/personal-hub-web" >> "$GITHUB_OUTPUT"

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  backend:
    name: 构建并推送 personal-hub-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 计算镜像名称
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/personal-hub-backend" >> "$GITHUB_OUTPUT"

      # ---------- App 热更新包：版本号用 CI 构建序号，保证单调递增 ----------
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 更新 App 版本号
        working-directory: frontend
        env:
          RELEASE_CODE: ${{ github.run_number }}
        run: |
          node --input-type=module -e "
            import fs from 'node:fs'
            const manifest = JSON.parse(fs.readFileSync('src/manifest.json', 'utf8'))
            manifest.versionCode = String(process.env.RELEASE_CODE)
            manifest.versionName = '1.0.' + process.env.RELEASE_CODE
            fs.writeFileSync('src/manifest.json', JSON.stringify(manifest, null, 2) + '\n')
            console.log('versionCode =', manifest.versionCode)
          "

      - name: 构建 App 前端资源
        working-directory: frontend
        run: |
          npm ci
          npm run build:app
          test -f dist/build/app/manifest.json

      - name: 打包 wgt 并注入后端资源
        env:
          RELEASE_CODE: ${{ github.run_number }}
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
        run: |
          NOTES_FILE="$RUNNER_TEMP/release-notes.txt"
          printf '%s' "$RELEASE_NOTES" | head -n 1 | cut -c 1-120 > "$NOTES_FILE" || true
          (cd frontend/dist/build/app && zip -qr "$RUNNER_TEMP/latest.wgt" .)
          mkdir -p backend/src/main/resources/app
          cp "$RUNNER_TEMP/latest.wgt" backend/src/main/resources/app/latest.wgt
          node --input-type=module -e "
            import fs from 'node:fs'
            const notes = fs.readFileSync(process.env.NOTES_FILE, 'utf8').trim() || '日常更新'
            const release = {
              versionCode: Number(process.env.RELEASE_CODE),
              versionName: '1.0.' + process.env.RELEASE_CODE,
              notes,
            }
            fs.writeFileSync('backend/src/main/resources/app/release.json', JSON.stringify(release, null, 2) + '\n')
            console.log('release:', JSON.stringify(release))
          "
          ls -la backend/src/main/resources/app/

      # ---------- 后端镜像（包含热更新包） ----------
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
